name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: zsh scripts/build-app.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict .build/ZOrderly.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' .build/ZOrderly.app/Contents/Info.plist)" = 'dev.zorderly.app'
